name: papers

on:
  push:
    paths:
      - '**.md'
      - 'paper-tools/**'
      - '.github/workflows/papers.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra

      - name: Build all papers (HTML + PDF)
        run: python3 paper-tools/build_all.py --html --pdf

      - name: Collect build outputs
        run: |
          mkdir -p _out
          { git ls-files -o --exclude-standard; git diff --name-only; } \
            | grep -E '\.(html|pdf)$' \
            | while read -r f; do
                # artifact paths may not contain '*' (and friends); encode as '@'
                safe="${f//\*/@}"
                if [ "$safe" != "$f" ]; then
                  echo "asterisks in repository paths are encoded as '@' in this artifact" > _out/PATHS.txt
                fi
                mkdir -p "_out/$(dirname "$safe")"
                cp "$f" "_out/$safe"
              done
          find _out -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: papers-${{ github.sha }}
          path: _out
          if-no-files-found: error
